<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Fem pinya! Temporada castellera</title>
<meta name="description" content="Joc de castells: porta la teva colla de la gamma bàsica de 6 als castells de 10.">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  @font-face{font-family:"Barlow";font-weight:400;font-style:normal;font-display:swap;src:url(fonts/barlow-latin-400-normal.woff2) format("woff2")}
  @font-face{font-family:"Barlow";font-weight:500;font-style:normal;font-display:swap;src:url(fonts/barlow-latin-500-normal.woff2) format("woff2")}
  @font-face{font-family:"Barlow";font-weight:600;font-style:normal;font-display:swap;src:url(fonts/barlow-latin-600-normal.woff2) format("woff2")}
  @font-face{font-family:"Barlow";font-weight:700;font-style:normal;font-display:swap;src:url(fonts/barlow-latin-700-normal.woff2) format("woff2")}
  @font-face{font-family:"Barlow Condensed";font-weight:600;font-style:normal;font-display:swap;src:url(fonts/barlow-condensed-latin-600-normal.woff2) format("woff2")}
  @font-face{font-family:"Barlow Condensed";font-weight:700;font-style:normal;font-display:swap;src:url(fonts/barlow-condensed-latin-700-normal.woff2) format("woff2")}
  @font-face{font-family:"Barlow Condensed";font-weight:800;font-style:normal;font-display:swap;src:url(fonts/barlow-condensed-latin-800-normal.woff2) format("woff2")}

  /* Camisa, faixa i mocador: full blanc com els pantalons, bandes negres com la faixa,
     el vermell del mocador només com a detall, i el color de la camisa de la colla com a accent. */
  :root{
    --paper:#1c2130; --ink:#f3f1ec; --faixa:#000; --mid:#a9afbd; --rule:rgba(255,255,255,.13); --soft:rgba(255,255,255,.06);
    --moc:#d3241c; --colla:#c8312b; --ok:#6fd39a; --warn:#f0c463; --bad:#ff8a7a;
    --gold:#f3c969; --dim:#a9afbd; --line:rgba(255,255,255,.13); --text:#f3f1ec;
    --fd:"Barlow Condensed","Arial Narrow",ui-sans-serif,sans-serif;
    --fb:"Barlow",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#2a3346;font-family:var(--fb);color:var(--ink)}
  #app{position:fixed;inset:0;touch-action:none;user-select:none;-webkit-user-select:none}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  .hidden{display:none!important}
  button{font-family:var(--fb);color:inherit}
  button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--colla);outline-offset:2px}

  /* ---------- Joc: marcador com una faixa ---------- */
  #play{position:absolute;inset:0;pointer-events:none}
  .top{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:12px;background:var(--faixa);color:#fff;
    padding:10px 14px 10px 12px;border-bottom:4px solid var(--colla)}
  .ttl{flex:1;min-width:0}
  .ttl b{display:block;font-family:var(--fd);font-size:22px;font-weight:800;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ttl span{display:block;font-size:13.5px;color:#d9d9d9;font-weight:500;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pts{flex:none;text-align:right;font-family:var(--fd);font-weight:800;font-size:26px;line-height:.9;font-variant-numeric:tabular-nums}
  .pts small{display:block;font-family:var(--fb);font-size:11px;color:#bdbdbd;font-weight:600;margin-top:2px}
  #hint{position:absolute;left:16px;right:16px;top:132px;text-align:center;font-weight:700;font-size:15px;color:#fff;
    text-shadow:0 1px 4px rgba(0,0,0,.7);transition:opacity .5s}
  #dismount{pointer-events:auto;position:absolute;left:50%;bottom:22px;transform:translateX(-50%);border:2px solid var(--faixa);
    background:#fff;color:#151515;border-radius:8px;padding:10px 22px;font-weight:700;font-size:15px;cursor:pointer;box-shadow:0 3px 0 var(--faixa)}

  /* ---------- Pantalles: un full blanc amb la faixa a dalt ---------- */
  #ui{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:34vh 8px 24px;touch-action:pan-y}
  #ui.full{padding-top:14px}
  #ui.low{display:flex;flex-direction:column;justify-content:flex-end;padding-top:20px}
  .sheet{max-width:500px;width:100%;margin:0 auto;background:var(--paper);border-radius:10px;padding:22px 18px 18px;position:relative;
    border-top:10px solid var(--faixa);box-shadow:0 18px 50px rgba(0,0,0,.35)}
  .brand{font-family:var(--fd);font-weight:800;font-size:64px;line-height:.85;letter-spacing:-.01em;margin:4px 0 0;color:var(--ink)}
  .brand i{font-style:normal;color:var(--moc)}
  .moc{height:16px;margin:-22px -18px 18px;background-color:var(--moc);
    background-image:radial-gradient(circle,#fff 1.6px,transparent 2px),radial-gradient(circle,#fff 1.6px,transparent 2px);
    background-size:12px 12px;background-position:0 0,6px 6px}
  .cname{font-family:var(--fd);font-weight:800;font-size:40px;line-height:.92;margin:0}
  .sub{color:var(--mid);font-size:14px;margin-top:4px}
  .lead{margin:12px 0 0;color:#d6d8de;font-size:15.5px;line-height:1.5}
  h2{font-family:var(--fd);font-weight:800;font-size:30px;line-height:.95;margin:0 0 6px}
  h3{font-family:var(--fd);font-weight:700;font-size:20px;margin:20px 0 8px}
  p{margin:6px 0}
  .btn{display:block;width:100%;font-weight:700;font-size:16px;border-radius:8px;padding:13px;cursor:pointer;border:2px solid var(--ink);margin-top:10px;text-align:center;background:transparent;color:var(--ink)}
  .btn.main{background:var(--colla);color:var(--colla-ink,#fff);border-color:var(--colla)}
  .btn.main:active{transform:translateY(1px)}
  .btn.alt{background:transparent;color:var(--ink)}
  .btn.ghost{border:0;background:none;color:var(--ink);font-weight:600;font-size:14px;padding:8px;text-decoration:underline;text-underline-offset:3px;text-decoration-color:rgba(255,255,255,.35)}
  .btn[disabled]{opacity:.35;cursor:default}
  .row2{display:flex;gap:8px}.row2 .btn{flex:1}
  /* xifres grans separades per filets, com un marcador */
  .stats{display:grid;grid-template-columns:repeat(3,1fr);margin-top:16px;border-top:2px solid var(--ink);border-bottom:1px solid var(--rule)}
  .stat{padding:9px 8px 8px;border-left:1px solid var(--rule)}
  .stat:first-child{border-left:0;padding-left:0}
  .stat b{display:block;font-family:var(--fd);font-size:30px;font-weight:800;line-height:.9;font-variant-numeric:tabular-nums}
  .stat span{display:block;font-size:12px;color:var(--mid);margin-top:3px}
  .stats.s4{grid-template-columns:repeat(4,1fr)}
  .stats.s4 .stat b{font-size:27px}
  .next{margin-top:14px;background:var(--soft);border-left:6px solid var(--colla);border-radius:0 8px 8px 0;padding:12px 14px}
  .next small{color:var(--mid);font-weight:600;font-size:13px}
  .next b{display:block;font-family:var(--fd);font-size:28px;font-weight:800;line-height:.95;margin-top:2px}
  .tabs{display:flex;gap:0;margin:20px 0 10px;border-bottom:1px solid var(--rule);overflow-x:auto}
  .tabs button{flex:1;border:0;background:none;padding:9px 4px 8px;font-weight:600;font-size:14px;cursor:pointer;color:var(--mid);border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
  .tabs button.on{color:var(--ink);font-weight:700;border-bottom-color:var(--colla)}
  .list{display:grid;gap:0;border-top:1px solid var(--rule)}
  .it{display:flex;align-items:center;gap:10px;background:none;border:0;border-bottom:1px solid var(--rule);border-radius:0;padding:10px 2px;text-align:left;width:100%;cursor:pointer;font-size:14px}
  .it:active{background:var(--soft)}
  .it.lock{opacity:.42;cursor:default}
  .it .mid{flex:1;min-width:0}
  .it .nm,.it .meta{display:block}
  .it .nm{font-weight:700;font-size:15.5px;line-height:1.15}
  /* el codi del castell, com als marcadors i a la taula del Concurs */
  .it .nm small{display:inline-block;font-family:var(--fd);font-weight:700;font-size:13px;color:#111;background:var(--ink);border-radius:3px;padding:1px 5px 0;margin-left:6px;vertical-align:1px;letter-spacing:.02em}
  .it .meta{font-size:12.5px;color:var(--mid);margin-top:3px}
  .it .rt{text-align:right;flex:none;font-family:var(--fd);font-weight:800;font-size:20px;font-variant-numeric:tabular-nums}
  .it .rt small{display:block;font-family:var(--fb);font-weight:600;font-size:11.5px;color:var(--mid)}
  .it svg{flex:none;width:30px;height:48px}
  .bar{height:4px;background:var(--rule);margin-top:6px;overflow:hidden;position:relative}
  .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--colla)}
  .bar i.add{background:var(--ink);opacity:.5}
  .tag{display:inline-block;font-size:11px;font-weight:700;padding:1px 6px;border-radius:3px;margin-left:5px;vertical-align:1px;border:1.5px solid currentColor}
  .tag.d{color:var(--ok)}.tag.c{color:var(--warn)}
  .risk{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:0}
  .grp{font-family:var(--fd);font-weight:700;font-size:17px;color:var(--ink);margin:16px 0 4px}
  .cnt{display:flex;align-items:center;gap:6px;flex:none}
  .cnt button{width:34px;height:34px;border-radius:6px;border:2px solid var(--ink);background:transparent;font-size:19px;font-weight:700;cursor:pointer;line-height:1}
  .cnt button[disabled]{opacity:.3}
  .cnt b{min-width:16px;text-align:center;font-family:var(--fd);font-size:20px}
  .slots{display:flex;gap:6px;margin:10px 0}
  .slots i{width:20px;height:20px;border-radius:3px;border:2px solid var(--ink)}
  .slots i.on{background:var(--colla);border-color:var(--colla)}
  .note{background:var(--soft);border-radius:6px;padding:10px 12px;font-size:14px;color:var(--ink);margin:10px 0}
  /* cartes: com cromos, amb la franja del color de la colla */
  .cards{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .card{position:relative;text-align:left;border:1.5px solid var(--rule);background:linear-gradient(160deg,#283149,#1f2638);border-radius:14px;padding:11px 10px 10px;cursor:pointer;font-size:13px;color:var(--ink)}
  .card .ic{font-size:26px;line-height:1}
  .card b{display:block;font-family:var(--fd);font-size:19px;font-weight:800;line-height:1;margin-top:6px}
  .card span{display:block;color:var(--mid);margin-top:4px;line-height:1.3}
  .card.on{border-color:var(--gold);background:linear-gradient(160deg,rgba(243,201,105,.22),rgba(243,201,105,.08))}
  .card.lock{opacity:.4;cursor:default;border-style:dashed}
  .rounds{display:grid;gap:0;margin:12px 0;border-top:2px solid var(--ink)}
  .rd{display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--rule);padding:10px 2px}
  .rd .n{width:26px;height:26px;border-radius:3px;background:var(--soft);display:grid;place-items:center;font-family:var(--fd);font-weight:800;font-size:16px;flex:none}
  .rd.cur .n{background:var(--colla);color:#fff}
  .rd .mid{flex:1}
  .rd>b{font-family:var(--fd);font-size:20px;font-variant-numeric:tabular-nums}
  .res-D{color:var(--ok);font-weight:600}.res-C{color:var(--warn);font-weight:600}.res-I{color:var(--bad);font-weight:600}.res-ID{color:var(--mid)}
  table{width:100%;border-collapse:collapse;font-size:14px;margin-top:6px;border-top:2px solid var(--ink)}
  td{padding:8px 4px;border-bottom:1px solid var(--rule);vertical-align:top}
  td:first-child{font-family:var(--fd);font-weight:700;color:var(--mid);width:26px}
  td.r{text-align:right;font-family:var(--fd);font-weight:800;font-size:17px;font-variant-numeric:tabular-nums}
  tr.me td{background:var(--soft);font-weight:700}
  tr.me td:first-child{box-shadow:inset 4px 0 0 var(--colla);padding-left:8px}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .chips span{font-size:13px;border:1.5px solid var(--rule);border-radius:4px;padding:4px 8px;font-weight:600}
  .chips .up{color:var(--ok);border-color:currentColor}.chips .dn{color:var(--bad);border-color:currentColor}
  .big{font-family:var(--fd);font-weight:800;font-size:54px;line-height:.88;margin:2px 0 8px}
  .score{font-family:var(--fd);font-weight:800;font-size:46px;font-variant-numeric:tabular-nums;line-height:1}
  .score small{font-family:var(--fb);font-size:15px;color:var(--mid);font-weight:600;margin-left:4px}
  .center{text-align:center}
  .colors{display:flex;flex-wrap:wrap;gap:9px}
  .rtag{font-style:normal;font-size:11px;padding:1px 6px;border-radius:3px;border:1.5px solid currentColor;color:var(--warn);margin-left:4px}
  .dot{display:inline-block;width:12px;height:12px;border-radius:2px;margin-right:8px;vertical-align:0;box-shadow:inset 0 0 0 1px rgba(255,255,255,.3)}
  .seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0 4px}
  .seg button{padding:10px;border-radius:8px;border:2px solid var(--rule);background:transparent;color:inherit;font:inherit;cursor:pointer;text-align:left}
  .seg button.on{border-color:var(--ink);box-shadow:inset 0 -4px 0 var(--colla)}
  .seg button b{display:block;font-family:var(--fd);font-size:19px;font-weight:800;line-height:1}
  .seg button span{display:block;font-size:12.5px;color:var(--mid);margin-top:3px;line-height:1.3}
  .chip{width:38px;height:38px;border-radius:6px;border:2px solid var(--paper);box-shadow:0 0 0 1.5px var(--rule);cursor:pointer}
  .chip.on{box-shadow:0 0 0 3px var(--ink)}
  select,input[type=text]{width:100%;font:inherit;font-size:16px;font-weight:600;padding:12px 14px;border-radius:8px;border:2px solid var(--rule);background:#262c3d;color:var(--ink);margin:6px 0 4px}
  input[type=text]{font-size:17px;user-select:text;-webkit-user-select:text}
  label{display:block;font-size:14px;color:var(--mid);margin-bottom:6px}
  .how{margin:8px 0 0;padding:0;list-style:none;display:grid;gap:0;font-size:14.5px;color:#d6d8de;line-height:1.45;border-top:1px solid var(--rule)}
  .how li{padding:9px 0;border-bottom:1px solid var(--rule)}
  .how b{color:var(--ink)}
  #toast{position:absolute;left:50%;top:14px;transform:translateX(-50%);display:grid;gap:6px;width:min(92vw,420px);pointer-events:none;z-index:5}
  #toast div{background:var(--faixa);color:#fff;font-weight:600;border-radius:6px;padding:11px 14px;font-size:14.5px;border-left:6px solid var(--colla);box-shadow:0 8px 24px rgba(0,0,0,.35);animation:tin .3s ease-out}
  @keyframes tin{from{transform:translateY(-10px);opacity:0}}
  .repte{margin-top:12px;border:2px solid var(--ink);border-radius:8px;padding:12px;background:transparent;box-shadow:4px 4px 0 var(--moc)}
  .repte b{color:var(--ink)}
  .shop{display:grid;gap:0;border-top:1px solid var(--rule)}
  .also{font-size:12px;color:var(--warn);margin-top:3px;font-weight:600}
  /* sobre de cartes: un mocador plegat */
  #pack{position:absolute;inset:0;z-index:8;display:grid;place-items:center}
  .pk-bg{position:absolute;inset:0;background:rgba(0,0,0,.9);animation:pkfade .4s ease-out}
  .pk-box{position:relative;width:min(92vw,420px);text-align:center}
  .pk-env{position:absolute;left:50%;top:50%;width:170px;height:118px;margin:-90px 0 0 -85px;border-radius:6px;
    background-color:var(--moc);background-image:radial-gradient(circle,#fff 2px,transparent 2.5px),radial-gradient(circle,#fff 2px,transparent 2.5px);
    background-size:16px 16px;background-position:0 0,8px 8px;box-shadow:0 18px 40px rgba(0,0,0,.5);
    animation:pkshake .7s ease-in-out .1s,pkgone .45s ease-in 1s forwards}
  .pk-flap{position:absolute;left:0;right:0;top:0;height:60px;background:rgba(0,0,0,.18);
    clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;animation:pkflap .35s ease-in .8s forwards}
  .pk-seal{display:none}
  .pk-cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:10px}
  .pc{perspective:900px;opacity:0;animation:pkin .5s cubic-bezier(.2,1.3,.4,1) var(--d) forwards}
  .pc-in{position:relative;height:190px;transform-style:preserve-3d;transform:rotateY(180deg);animation:pkflip .6s ease calc(var(--d) + .25s) forwards;border-radius:8px}
  .pc-in.glow{box-shadow:0 0 0 2px var(--gold),0 0 26px rgba(243,201,105,.7)}
  .pc-f{position:absolute;inset:0;border-radius:8px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px;gap:6px}
  .pc-back{transform:rotateY(180deg);background-color:var(--moc);background-image:radial-gradient(circle,#fff 2px,transparent 2.5px),radial-gradient(circle,#fff 2px,transparent 2.5px);
    background-size:16px 16px;background-position:0 0,8px 8px;border:3px solid #fff}
  .pc-back span{display:none}
  .pc-face{background:linear-gradient(160deg,#2a3450,#1a2032);color:var(--ink);border:1.5px solid rgba(243,201,105,.55)}
  .pc-ic{font-size:40px;line-height:1}
  .pc-face b{font-family:var(--fd);font-size:21px;font-weight:800;line-height:1}
  .pc-lv{color:var(--gold);font-size:14px;letter-spacing:1px}.pc-lv i{font-style:normal;opacity:.25}
  .pc-cp{font-size:12.5px;color:var(--mid)}
  .pc-up{font-size:12px;font-weight:700;color:#1a1408;background:var(--gold);border-radius:4px;padding:3px 8px}
  .pk-ok{opacity:0;animation:pkfade .4s ease 3.4s forwards;max-width:300px;margin:12px auto 0}
  .pk-ok.btn.main{background:#fff;color:#151515;border-color:#fff}
  @keyframes pkfade{from{opacity:0}to{opacity:1}}
  @keyframes pkshake{0%,100%{transform:rotate(0)}20%{transform:rotate(-6deg) scale(1.04)}40%{transform:rotate(6deg) scale(1.06)}60%{transform:rotate(-4deg) scale(1.08)}80%{transform:rotate(3deg) scale(1.1)}}
  @keyframes pkflap{to{transform:rotateX(180deg);opacity:.2}}
  @keyframes pkgone{to{transform:scale(1.4);opacity:0}}
  @keyframes pkin{from{opacity:0;transform:translateY(60px) scale(.6)}to{opacity:1;transform:none}}
  @keyframes pkflip{to{transform:rotateY(0)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}#pack .pc,#pack .pk-ok{opacity:1}#pack .pc-in{transform:none}#pack .pk-env{display:none}}
</style>
</head>
<body>
<div id="app">
  <canvas id="c"></canvas>
  <div id="play" class="hidden">
    <div class="top">
      <div class="ttl"><b id="pName"></b><span id="pPhase"></span></div>
      <div class="pts"><span id="pPts"></span><small>punts</small></div>
    </div>
    <div id="hint"></div>
    <button id="dismount">Desmunta</button>
  </div>
  <div id="ui"></div>
  <div id="toast"></div>
</div>

<script>
'use strict';
/* =========================================================
   DADES: taula de puntuacions del Concurs de Castells 2026
   [codi, descarregat, carregat, amplada, pisos, modificadors, a la taula]
   ========================================================= */
const RAW=[
 ['Pd4',120,100,1,4,'',0],['3d6',200,165,3,6,'',0],['4d6',180,150,4,6,'',0],['5d6',240,200,5,6,'',0],
 ['2d6',300,250,2,6,''],['Pd5',315,260,1,5,''],['9d6',355,295,9,6,''],['4d7',395,325,4,7,''],['3d7',415,345,3,7,''],
 ['4d7a',515,465,4,7,'a'],['3d7a',545,485,3,7,'a'],['7d7',555,460,7,7,''],['5d7',565,470,5,7,''],['7d7a',640,570,7,7,'a'],
 ['5d7a',670,605,5,7,'a'],['3d7s',705,635,3,7,'s'],['9d7',740,615,9,7,''],['2d7',805,670,2,7,''],['4d8',845,700,4,8,''],

function tone(f,t0,dur,type,vol,bp){

    let node=o;if(bp){const q=AC.createBiquadFilter();q.type='bandpass';q.frequency.value=bp;q.Q.value=1.1;o.connect(q);node=q;}
    node.connect(g);g.connect(AC.destination);const t=AC.currentTime+t0;

    o.start(t);o.stop(t+dur+.05);}catch(e){}
}

  try{const b=AC.createBuffer(1,AC.sampleRate*dur,AC.sampleRate),d=b.getChannelData(0);

}

      if(a.dbl){const A=a.dbl[0],B=a.dbl[1],q=clamp((p-.32)/.36,0,1),sm=q*q*(3-2*q);a.enxOff=A+(B-A)*sm;a.aletaOn=p<.28||p>.7;

        else if(p>.3&&p<.62)setPhase('L’enxaneta passa a l’altre pom');}
      else a.aletaOn=true;

    case 'descent':case 'dismount':{
      const j=Math.ceil(a.up)-1;a.up-=dt/(a.F[Math.max(0,j)].role==='tronc'?a.P.tDesc:a.P.tDesc*(a.A&&j===a.n-1?1.6:.8));
      if(a.A&&a.aletaDone&&!a.enxOnAg&&a.up<=a.n-1)a.enxOnAg=true;
      if(a.up<=1){a.up=1;
        if(a.A){a.dismounting=a.phase==='dismount';a.phase='descentP';a.pt=0;a.pu=a.enxOnAg?a.A.length:a.A.length-1;
          if(!a.dismounting&&a.enxOnAg){a.carregat=true;a.aletaP=true;sfx.carregat();haptic([30,40,30]);setPhase(NOM().carregatAg);}
          else setPhase(NOM().quedaAg);return;}
        if(a.phase==='descent'){a.phase='celebra';a.pt=0;a.L*=.3;sfx.descarregat();setPhase('Castell descarregat!');startCele();}else finishAttempt('ID');return;}
      setPhase(a.phase==='dismount'?'Desmuntant: '+a.F[Math.ceil(a.up)-1].down.toLowerCase():(a.A&&Math.ceil(a.up)-1===a.n-1)?NOM().passaAg:a.F[Math.ceil(a.up)-1].down);
      physics(dt);break;}
    case 'descentP':{
      if(a.aletaP){if(a.pt>.35&&!a.agAletaOn){a.agAletaOn=true;sfx.ding();setPhase(NOM().aletaAg);}
        if(a.pt>.35+a.P.tAleta*1.1){a.aletaP=false;a.agAletaOn=false;a.pt=.5;}physics(dt);break;}
      if(a.pt<.5){physics(dt);break;}
      a.pu-=dt/(a.P.tDesc*1.05);

      setPhase(a.A[Math.ceil(a.pu)-1].down);physics(dt);break;}
    case 'celebra':a.L*=.9;if(a.pt>2.8)finishAttempt('D');break;
    case 'fall':
      a.parts.forEach(p=>{if(p.rest)return;p.vy+=1100*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt;

      if(a.pt>2.2)finishAttempt(a.carregat?'C':'I');break;

}
function leanPx(){return att.L*fw*1.15;}
function floorXAt(i,nuO){const a=att,nu=nuO||Math.max(1,a.up-1);return cx+leanPx()*Math.pow(clamp(i/nu,0,1.2),1.5)+Math.sin(T*23+i*1.7)*Math.min(3,Math.abs(a.L)*2.2)*(i/a.n);}
function agullaVis(){
  const a=att;if(!a.A||a.phase==='fall')return[];const out=[];
  if(a.phase==='descentP'){const full=Math.floor(a.pu+1e-6),fr=a.pu-full,nu=Math.max(1,a.pu-1);
    for(let j=1;j<a.A.length;j++){if(j<full)out.push({p:a.A[j],x:floorXAt(j,nu),al:1,dy:0});else if(j===full&&fr>.001)out.push({p:a.A[j],x:floorXAt(j,nu),al:fr,dy:(1-fr)*a.A[j].hh*.8});}
    return out;}
  const lim=a.phase==='ready'||a.phase==='build'?Math.floor(a.up+1e-6):99;
  for(let j=1;j<a.A.length;j++){const q=a.A[j];if(q.top){if(a.enxOnAg)out.push({p:q,x:floorXAt(q.src),al:1,dy:0});continue;}
    if(q.src<lim)out.push({p:q,x:floorXAt(q.src),al:1,dy:0});}

}
function fall(){

  const add=(f,x,i,seed)=>a.parts.push({x,y:f.y,f,seed,vx:dir*(40+i*28)*(.6+Math.random()*.8),vy:-(20+Math.random()*90),rot:0,
    vr:dir*(1.5+Math.random()*3)*(.4+i/a.n),ry:ground-h*.85+Math.random()*h*.3,rest:false});
  for(let i=1;i<full;i++){const f=a.F[i];figXs(floorXAt(i),f).forEach((x,j)=>add(f,x,i,i*10+j));}
  agullaVis().forEach((v,j)=>add(v.p,v.x,v.p.src||j,700+j));
  a.phase='fall';a.pt=0;$('#dismount').classList.add('hidden');

}

function draw(){
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.fillStyle='#b99f7c';ctx.fillRect(0,0,W,H);
  applyCam();ctx.drawImage(bg,0,0,W,H);
  if(att&&att.phase==='celebra'&&celeFrames)pinya=celeFrames[Math.floor(att.pt*6.5)%3];
  if(pinya&&pinya.back)ctx.drawImage(pinya.back.cv,0,pinya.back.top,W,pinya.back.hgt);
  if(pinya&&pinya.rings)drawRings(true);
  if(!att){const F=scene.F,n=F.length;for(let i=1;i<n;i++)drawFloor(cx+Math.sin(T*1.2)*fw*.05*(i+1)/n,F[i].y,F[i],{aleta:i===n-1},i);
    ctx.drawImage(pinya.cv,0,pinya.top,W,H-pinya.top);drawRings();}
  else{
    const a=att,full=Math.floor(a.up+1e-6),frac=a.up-full;
    // els que pugen (o baixen) ho fan per darrere del castell
    const transfer=a.A&&a.phase==='descent'&&full===a.n-1&&frac>.001;
    if(frac>.001&&full<a.n&&!transfer){const f=a.F[full],xs=figXs(floorXAt(full),f);
      // tot el pis puja alhora (amb una diferència mínima entre ells)
      xs.forEach((xx,j)=>{const lag=[0,.03,.015,.04,.01,.035,.02,.045,.025][j%9],e=clamp((frac-lag)/(1-.045),0,1),ee=1-Math.pow(1-e,2);
        const yy=ground-h*.6+(f.y-(ground-h*.6))*ee;drawFig(xx+(1-ee)*fw*.25*(j%2?1:-1),yy,f,{seed:full*10+j,back:true,up:ee<.95});});}
    agullaVis().forEach(v=>{ctx.globalAlpha=v.al;drawFig(v.x,v.p.y+v.dy,v.p,{seed:600+(v.p.src||0),aleta:!!(v.p.top&&a.agAletaOn)});ctx.globalAlpha=1;});
    for(let i=1;i<Math.min(full,a.n);i++){let f=a.F[i];if(i===a.n-1&&a.dbl)f=Object.assign({},f,{off:[a.phase==='descent'?a.dbl[1]:a.enxOff]});
      drawFloor(floorXAt(i),f.y,f,{aleta:i===a.n-1&&a.aletaOn},i);}
    if(transfer){const f=a.F[a.n-1],q=a.A[a.A.length-1],e=1-frac,ee=e*e*(3-2*e),x0=floorXAt(a.n-1)+(a.dbl?a.dbl[1]:f.off[0])*fw,x1=floorXAt(q.src);
      const y=f.y+(q.y-f.y)*ee-Math.sin(Math.PI*ee)*h*.25;drawFig(x0+(x1-x0)*ee,y,q,{seed:(a.n-1)*10,up:ee>.15&&ee<.85});}
    ctx.drawImage(pinya.cv,0,pinya.top,W,H-pinya.top);drawRings();
    if(a.phase==='aleta'||a.phase==='celebra')drawMocadors();
    a.parts.forEach(p=>{ctx.save();ctx.translate(p.x,p.y-p.f.hh*.5);ctx.rotate(p.rot);drawFig(0,p.f.hh*.5,p.f,{seed:p.seed});ctx.restore();});
  }
  ctx.setTransform(DPR,0,0,DPR,0,0);
  if(TOD[curTod].tint){ctx.fillStyle=TOD[curTod].tint;ctx.fillRect(0,0,W,H);}
  ctx.drawImage(vign,0,0,W,H);
  if(att&&att.phase!=='fall'&&att.phase!=='celebra')drawMeter();
  if(att&&att.touch){ctx.strokeStyle='rgba(255,255,255,.55)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(att.touch.x,att.touch.y,26,0,Math.PI*2);ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,.18)';dot(att.touch.x,att.touch.y,26);}
}
function drawMeter(){
  const a=att,bw=Math.min(W*.82,360),bx=cx-bw/2,by=86,bh=12,R=1.7,z=(a.thrNow||a.P.thr)/R;
  const danger=clamp((Math.abs(a.L)/(a.thrNow||a.P.thr)-.6)/.4,0,1);
  ctx.save();rr(bx,by,bw,bh,6);ctx.clip();
  ctx.fillStyle=`rgba(${180+60*danger},70,58,.9)`;ctx.fillRect(bx,by,bw,bh);
  ctx.fillStyle='#d9a441';ctx.fillRect(cx-bw*.5*z*1.25,by,bw*z*1.25,bh);
  ctx.fillStyle='#4fae6f';ctx.fillRect(cx-bw*.5*z,by,bw*z,bh);
  ctx.fillStyle='#2f8a4f';ctx.fillRect(cx-bw*.5*z*.35,by,bw*z*.35,bh);
  ctx.restore();ctx.strokeStyle='rgba(255,255,255,.5)';ctx.lineWidth=1;rr(bx,by,bw,bh,6);ctx.stroke();
  const nx=cx+clamp(a.L/R,-1,1)*bw/2;

/* ================= Lògica de temporada ================= */
function bestCastell(){if(!S)return CM['3d6'];let b=CM['3d6'];CAST.forEach(c=>{if(S.best[c.code]==='D'&&!c.pilar&&c.d>b.d)b=c;});return b;}
function prepGain(c,n){let g=0;for(let i=0;i<n;i++)g+=Math.max(4,30-24*c.diff)*Math.pow(.65,i);return g;}
function satGain(p,g){return g*(1-.55*p/100);}
function rings(c){return (c.f?1:0)+(c.m?1:0)+(c.p?1:0);}
function related(code){const c=CM[code];return CAST.filter(x=>x.w===c.w&&x.n===c.n+1&&rings(x)>rings(c)&&x.a===c.a&&x.s===c.s).map(x=>x.code);}
function trainCastell(code,g){
  S.prep[code]=Math.min(100,prepOf(CM[code])+satGain(prepOf(CM[code]),g));
  ancestors(code).forEach((a,i)=>{S.prep[a]=Math.min(100,prepOf(CM[a])+satGain(prepOf(CM[a]),g*[1.25,1,.8,.65,.5][Math.min(i,4)]));});
  related(code).forEach(x=>{S.prep[x]=Math.min(100,prepOf(CM[x])+satGain(prepOf(CM[x]),g*.3));});
}
function weekGains(){
  const out={},w=S.wk;
  Object.entries(w.assign).forEach(([code,n])=>{if(!n)return;const g=prepGain(CM[code],n);out[code]=(out[code]||0)+satGain(prepOf(CM[code]),g);
    ancestors(code).forEach((a,i)=>{out[a]=(out[a]||0)+satGain(prepOf(CM[a]),g*[1.25,1,.8,.65,.5][Math.min(i,4)]);});
    related(code).forEach(x=>{out[x]=(out[x]||0)+satGain(prepOf(CM[x]),g*.3);});});
  return out;
}
function maxN(){let n=6;CAST.forEach(c=>{if(!c.pilar&&(S.best[c.code]==='D'||S.best[c.code]==='C'))n=Math.max(n,c.n);});return n;}
function makeOffer(){
  const nearR=S.rivals.map((r,i)=>({i,pts:r.best})).filter(x=>x.pts>0).sort((a,b)=>Math.abs(a.pts-S.seasonBest)-Math.abs(b.pts-S.seasonBest))[0];
  const nextP=PIL.find(p=>S.best[p.code]!=='D'&&prereqOk(p));
  const opts=[
    {id:'tv',text:'La televisió emetrà la vostra diada: descarregueu els 3 castells.'},
    {id:'subv',n:Math.min(10,maxN()+1),text:`L’Ajuntament us dona una subvenció si feu un castell de ${Math.min(10,maxN()+1)}, carregat o descarregat.`},
    {id:'net',text:'Diada neta: que no caigui cap castell, ni en intent.'},
    {id:'estrena',text:'Estreneu un castell: descarregueu-ne un que no hàgiu fet mai.'},
    {id:'gran',x:Math.max(700,Math.round(S.seasonBest*1.15/50)*50),text:`Feu com a mínim ${fmt(Math.max(700,Math.round(S.seasonBest*1.15/50)*50))} punts a la diada.`},
    {id:'assaig',text:'Assaig obert al poble: feu tots els assajos de la setmana.'},
  ];
  if(nearR)opts.push({id:'rival',ri:nearR.i,text:(/^Colla/.test(RIV[nearR.i].name)?`La ${RIV[nearR.i].name} us desafia`:`Els ${RIV[nearR.i].name} us desafien`)+': feu més punts que ells aquest cap de setmana.'});
  if(nextP)opts.push({id:'canalla',code:nextP.code,text:`La canalla vol estrenar un pilar: descarregueu el ${nextP.name}.`});
  const o=pick(opts);
  const missing=REWARDS.filter(id=>!S.cards.includes(id));
  o.card=missing.length&&Math.random()<.75?pick(missing):(Math.random()<.5?pick(S.cards):null);

function closeWeek(){

function settleRepte(ok){

function diadaTotal(d){

  for(const r of ok){if(n>=3)break;if(r.res==='C'){if(nc>=2)continue;nc++;}tot+=r.pts;n++;}return tot;

function applyResult(res,c,ctxType){
  const chips=[],unl=[];let pts=0;
  const first=res==='D'&&S.best[c.code]!=='D';
  if(res==='D')S.best[c.code]='D';else if(res==='C'&&!S.best[c.code])S.best[c.code]='C';
  if(ctxType==='assaig'){
    const g=Math.round({D:14,C:8,I:3,ID:4}[res]*(1-.45*c.diff));S.prep[c.code]=Math.min(100,prepOf(c)+g);chips.push(`<span class="up">Preparació +${g}</span>`);
    if(res==='I'){const n=1+((Math.random()*2)|0);S.injured.push({n,w:1});chips.push(`<span class="dn">${n} ${n>1?'lesionats':'lesionat'} una setmana</span>`);}
  }else{
    const d=S.diada,conc=CAL[d.ev].concurs,cards=d.cards;
    pts=res==='D'?c.d:res==='C'?c.c:0;
    if(res==='C'&&cl('ambicio')&&!conc&&(d.ambUsed||0)<1+Math.floor((cl('ambicio')-1)/2)){d.ambUsed=(d.ambUsed||0)+1;pts=c.d;chips.push('<span class="up">Ambició: puntua com a descarregat</span>');}
    if(cl('placa')&&!conc)pts=Math.round(pts*(1+.15*mul(cl('placa'))));
    let dm={D:2+Math.round(c.diff*6),C:1,ID:-2,I:-(7+Math.round(c.diff*8))}[res];
    if(res==='D'&&cl('mocadors'))dm+=Math.round(4*mul(cl('mocadors')));
    S.moral=clamp(S.moral+dm,10,100);chips.push(`<span class="${dm>0?'up':'dn'}">Moral ${dm>0?'+':''}${dm}</span>`);
    // fer-lo a plaça també és assajar: descarregat = assaig doble, carregat = un assaig
    const na={D:2,C:1,ID:.5}[res];
    if(na){const p0=prepOf(c),g=prepGain(c,Math.ceil(na))*(na<1?na:1);trainCastell(c.code,g);
      chips.push(`<span class="up">Preparació +${Math.max(1,Math.round(prepOf(c)-p0))}${ancestors(c.code).length?' (i la seva estructura)':''}</span>`);}
    else{S.prep[c.code]=clamp(prepOf(c)-8,0,100);chips.push('<span class="dn">Preparació −8</span>');}
    if(res==='I'){const n=1+Math.floor(Math.random()*(2+c.diff*6)),w=2+((Math.random()*2)|0);S.injured.push({n,w});chips.push(`<span class="dn">${n} ${n>1?'lesionats':'lesionat'} (${w} setmanes)</span>`);}
    if(first)d.firsts=(d.firsts||0)+1;
  }
  S.tot[res]++;
  if(first&&INEDIT.has(c.code)&&ctxType!=='assaig'){S.bonus+=300;S.members+=20;S.moral=clamp(S.moral+15,10,100);unl.unshift(`Heu fet història: primer ${c.name} descarregat! +300 de bonus i 20 castellers nous.`);}
  if(first){chips.push('<span class="up">Primer cop!</span>');CAST.filter(x=>PRE[x.code]===c.code).forEach(x=>unl.push(`Nou castell a la cartellera: ${x.name}`));}
  checkFites(c,res).forEach(t=>unl.push(t));
  persist();return{pts,chips,unl};
}
function giveCard(id,out,copy){
  if(!S.cards.includes(id)){S.cards.push(id);S.cardLv[id]={lv:1,cp:0};out.push(`Nova carta: ${CARDM[id].name}`);}
  else if(copy){S.cardLv[id]=S.cardLv[id]||{lv:1,cp:0};S.cardLv[id].cp++;out.push(`Còpia de carta: ${CARDM[id].name}`);}
}
function checkFites(c,res){
  const out=[],g=id=>giveCard(id,out),ok=res==='D'||res==='C';
  if(res==='D'&&!c.pilar&&c.n>=7)g('cap');
  if(res==='D'&&!c.pilar&&c.n>=8)g('enxaneta');
  if(res==='I')g('segona');
  if(ok&&c.f)g('folre');
  if(ok&&c.m)g('manilles');
  if(res==='D'&&c.code==='Pd6')g('pilarfe');
  if(res==='D'&&c.code==='2d7')g('torre');

  if(res==='D'&&c.a)g('agulla');

}

// la diada real d'una setmana, tenint en compte que a Valls només hi actuen les colles de Valls
function realEv(ev){const R=S&&S.real?RACT[ev]:null;if(!R)return null;return R.valls&&!vallsB()?R.alt:R;}

/* ---------- simulació de colles rivals ---------- */
function rivalAct(r,concurs){
  const pk=i=>TBL[clamp(Math.round(i),0,TBL.length-1)];
  const tryC=(c,pd)=>{const x=Math.random();return x<pd?{c,res:'D',p:c.d}:x<pd+.14?{c,res:'C',p:c.c}:{c,res:'I',p:0};};
  if(!concurs){
    const amb=Math.random()<.3;const used=new Set();const out=[];
    [[r.s+(amb?1:0),amb?.5:.72],[r.s-1,.82],[r.s-2,.88]].forEach(([i,pd])=>{let c=pk(i);let k=i;while(used.has(c.code)&&k>0){k--;c=pk(k);}used.add(c.code);out.push(tryC(c,pd));});
    const pi=r.s>=36?4:r.s>=26?3:r.s>=16?2:r.s>=6?1:0;out.push(tryC(PIL[pi],.85));
    return{pts:out.reduce((a,x)=>a+x.p,0),list:out.map(x=>x.c.code+SUF[x.res]).join(', ')};
  }
  const tries=[[r.s+1,.42],[r.s,.74],[r.s-1,.82],[r.s+1,.42],[r.s-2,.86]].map(([i,pd])=>tryC(pk(i+Math.random()-.5),pd));
  const ok=tries.filter(x=>x.p).sort((a,b)=>b.p-a.p);let t=0,n=0,nc=0;const best=[];
  for(const x of ok){if(n>=3)break;if(best.some(b=>b.c.code===x.c.code))continue;if(x.res==='C'){if(nc>=2)continue;nc++;}t+=x.p;n++;best.push(x);}
  return{pts:t,list:best.map(x=>x.c.code+SUF[x.res]).join(', ')};
}
const myCol=()=>S.colla.col?{col:S.colla.col,st:S.colla.st}:COLORS[S.colla.color]||COLORS[0];
const colOf=n=>RIV.find(x=>x.name===n)||myCol();
function seasonRank(){return [{name:S.colla.name,pts:S.seasonBest,me:true},...S.rivals.map((r,i)=>({name:RIV[i].name,pts:r.best}))].sort((a,b)=>b.pts-a.pts);}
function weekendRivals(){S.lastAct={};S.rivals.forEach((r,i)=>{const a=rivalAct(r,false);S.lastAct[i]=a;r.best=Math.max(r.best,a.pts);});}
function guestsFor(ev){
  const out=[];const e=CAL[ev];
  const RE=realEv(ev);
  if(RE&&RE.g){RE.g.forEach(n=>{const i=RIV.findIndex(r=>r.name===n);if(i>=0)out.push(i);});
    // si en falten (la teva colla era una de les convidades, o la diada té menys colles), s'hi afegeixen colles de nivell semblant
    if(RE.valls)return out;
    const rk=seasonRank(),me=rk.findIndex(r=>r.me);let k=0;
    while(out.length<2&&k++<200){const n=rk[clamp(Math.round(me+(Math.random()-.5)*8),0,rk.length-1)];if(n.me)continue;const ci=RIV.findIndex(r=>r.name===n.name);if(ci>=0&&!out.includes(ci))out.push(ci);}
    return out;}
  if(e.town)out.push(S.towns[ev]);
  const rk=seasonRank(),me=rk.findIndex(r=>r.me);
  const byLevel=S.rivals.map((r,i)=>({i,s:r.s})).sort((a,b)=>b.s-a.s);
  if(e.big){byLevel.slice(0,3).forEach(x=>{if(!out.includes(x.i)&&out.length<3)out.push(x.i);});}
  while(out.length<(e.big?3:2)){const cand=byLevel[clamp(Math.round(me+(Math.random()-.5)*8),0,byLevel.length-1)].i;if(!out.includes(cand))out.push(cand);}
  return out;
}
function endDiada(sim){
  const d=S.diada,ev=CAL[d.ev],tot=diadaTotal(d),chips=[],notes=[];
  let gain=0;d.rounds.forEach(r=>{const c=CM[r.code];if(r.res==='D')gain+=2+Math.round(c.d/300);else if(r.res==='C')gain+=1+Math.round(c.d/700);});
  if(cl('reclam'))gain+=Math.round(6*mul(cl('reclam')));
  // bonus casteller
  let bonus=d.rounds.reduce((a,r)=>{const c=CM[r.code];return a+(r.res==='D'?c.d/30:r.res==='C'?c.c/60:0);},0)+(d.firsts||0)*25;
  const cast3=d.rounds.filter((r,i)=>!(!ev.concurs&&i===d.max-1));
  const rodona=!ev.concurs&&cast3.length>=3&&cast3.every(r=>r.res==='D');
  if(rodona){bonus+=30;S.moral=clamp(S.moral+5,10,100);notes.push('Diada rodona: tots els castells descarregats.');giveCard('mans',notes);}
  if(ev.big)bonus*=1.5;if(ev.concurs)bonus*=2;if(cl('premsa'))bonus*=1+mul(cl('premsa'));if(sim)bonus*=.6;
  if(tot>=2000&&!ev.concurs)giveCard('placa',notes);
  S.diades++;if(S.diades>=4)giveCard('assaig',notes);
  if(cl('obert'))S.buffs.assaig+=2+Math.floor((cl('obert')-1)/2);
  let table=null,tableTitle='';
  if(ev.concurs){
    const rk=seasonRank(),pos0=rk.findIndex(r=>r.me);
    const jor=pos0<12?'diumenge':pos0<24?'dissabte':'Torredembarra';
    const lo=jor==='diumenge'?0:jor==='dissabte'?12:24,hi=jor==='diumenge'?12:jor==='dissabte'?24:41;
    let names=rk.slice(lo,hi).filter(r=>!r.me).map(r=>r.name);
    const RC=S.real&&RACT[d.ev]&&RACT[d.ev].conc?RACT[d.ev].conc[jor==='Torredembarra'?'torre':jor]:null;
    if(RC)names=RC.filter(n=>RIV.some(r=>r.name===n));
    const rows=[{name:S.colla.name,pts:tot,me:true,list:d.rounds.map(r=>r.code+SUF[r.res]).join(', ')}];
    names.forEach(n=>{const i=RIV.findIndex(x=>x.name===n);const a=rivalAct(S.rivals[i],true);S.rivals[i].conc=a.pts;rows.push({name:n,pts:a.pts,list:a.list});});
    rows.sort((a,b)=>b.pts-a.pts);const pos=rows.findIndex(r=>r.me)+1;S.concurs={pos,pts:tot,jornada:jor};
    tableTitle=`Classificació de la jornada de ${jor}`;
    table=rows.map((r,i)=>`<tr class="${r.me?'me':''}"><td>${i+1}</td><td>${cdot(r.me?myCol():colOf(r.name))}${esc(r.name)}<br><span class="sub">${cdList(r.list)}</span></td><td class="r">${fmt(r.pts)}</td></tr>`).join('');
    const prize=pos===1?[20,15,200]:pos<=3?[12,10,120]:pos<=6?[6,5,60]:[2,0,20];gain+=prize[0];S.moral=clamp(S.moral+prize[1],10,100);bonus+=prize[2];
    notes.unshift(pos===1?`Heu guanyat la jornada de ${jor} del Concurs!`:`${pos}a posició a la jornada de ${jor} del Concurs.`);
    if(pos<=3&&jor==='diumenge')giveCard('mistica',notes);
  }else{
    weekendRivals();
    S.seasonBest=Math.max(S.seasonBest,tot);
    const g=guestsFor(d.ev);tableTitle='Colles a plaça';
    const rows=[{name:S.colla.name,pts:tot,me:true,list:d.rounds.map(r=>r.code+SUF[r.res]).join(', ')},...g.map(i=>({name:RIV[i].name,pts:S.lastAct[i].pts,list:S.lastAct[i].list}))];
    table=rows.map(r=>`<tr class="${r.me?'me':''}"><td></td><td>${cdot(r.me?myCol():colOf(r.name))}${esc(r.name)}<br><span class="sub">${cdList(r.list)}</span></td><td class="r">${fmt(r.pts)}</td></tr>`).join('');
    const pos=seasonRank().findIndex(r=>r.me)+1;chips.push(`<span>${pos}a al rànquing</span>`);
  }
  // reptes
  if(S.repte&&S.repte.id!=='assaig'){
    const r=S.repte;let ok=false;
    if(r.id==='tv')ok=rodona;
    else if(r.id==='subv')ok=d.rounds.some(x=>(x.res==='D'||x.res==='C')&&CM[x.code].n>=r.n&&!CM[x.code].pilar);
    else if(r.id==='net')ok=d.rounds.every(x=>x.res!=='I');
    else if(r.id==='estrena')ok=(d.firsts||0)>0;
    else if(r.id==='gran')ok=tot>=r.x;
    else if(r.id==='rival')ok=!S.lastAct[r.ri]||tot>S.lastAct[r.ri].pts;
    else if(r.id==='canalla')ok=d.rounds.some(x=>x.code===r.code&&x.res==='D');
    settleRepte(ok).forEach(t=>notes.push(t));
  }
  bonus=Math.round(bonus);S.bonus+=bonus;
  S.members+=gain;chips.unshift(`<span class="up">+${gain} castellers</span>`,`<span class="up">+${bonus} bonus</span>`);chips.push(`<span>Moral ${Math.round(S.moral)} %</span>`);
  if(sim)notes.unshift('Diada simulada.');
  S.results.push({ev:d.ev,pts:tot,list:d.rounds.map(r=>r.code+SUF[r.res]).join(', ')});
  const evIdx=d.ev;S.diada=null;advanceWeek();
  persist();
  go('summary',{evName:evName(evIdx),title:ev.concurs?'Concurs acabat':tot>0?'Diada acabada':'Diada en blanc',pts:tot,chips,notes,table,tableTitle,seasonEnd:S.ev>=CAL.length});
}
function advanceWeek(){S.ev++;S.step='assaig';}
function simulateDiada(){
  startDiada();const d=S.diada,ev=CAL[d.ev];
  for(let i=0;i<d.max;i++){
    const isP=!ev.concurs&&i===d.max-1,done=new Set(d.rounds.filter(r=>r.res==='D'||r.res==='C').map(r=>r.code));
    const pool=CAST.filter(c=>(isP?c.pilar:(ev.concurs?c.table:!c.pilar))&&!lockWhy(c)&&!done.has(c.code)).sort((a,b)=>b.d-a.d);
    if(!pool.length){d.rounds.push({code:isP?'Pd4':'3d6',res:'ID',pts:0});continue;}
    const c=pool.find(c=>effE(c,'diada')<.55)||pool[pool.length-1],E=effE(c,'diada');
    const pD=clamp(1.02-.95*E,.05,.97),x=Math.random(),res=x<pD?'D':x<pD+(1-pD)*.45?'C':'I';

}
function newSeason(){
  S.season++;S.ev=0;S.step='assaig';S.members=Math.round(S.members*.92);S.seasonBest=0;S.results=[];S.concurs=null;S.wk=null;S.repte=null;S.towns=seasonTowns();
  Object.keys(S.prep).forEach(k=>S.prep[k]=Math.round(S.prep[k]*.55));

}

/* ================= Accions ================= */
function openPack(got){
  const col=shirt(),el=document.createElement('div');el.id='pack';
  const card=(g,i)=>{const c=CARDM[g.id],need=LVNEED[g.lv]||0,up=g.lv<LVMAX&&g.cp>=need;
    return `<div class="pc" style="--d:${1.15+i*.5}s"><div class="pc-in${up?' glow':''}">
      <div class="pc-f pc-back" style="--c:${col}"><span>Fem<br>pinya!</span></div>
      <div class="pc-f pc-face"><div class="pc-ic">${c.ico}</div><b>${c.name}</b>
        <span class="pc-lv">${'★'.repeat(g.lv)}<i>${'★'.repeat(LVMAX-g.lv)}</i></span>
        <span class="pc-cp">+1 còpia: ${g.cp} de ${need}</span>${up?'<span class="pc-up">Ja pots pujar de nivell!</span>':''}</div></div></div>`;};
  el.innerHTML=`<div class="pk-bg"></div><div class="pk-box">
    <div class="pk-env" style="--c:${col}"><div class="pk-flap"></div></div>
    <div class="pk-cards">${got.map(card).join('')}</div>
    <button class="btn main pk-ok" data-act="packOk">Continua</button></div>`;
  document.getElementById('app').appendChild(el);
  got.forEach((g,i)=>setTimeout(()=>{try{sfx.ding();}catch(e){}},1350+i*500));
  setTimeout(()=>{try{tone(300,0,.25,'triangle',.08);noise(.3,.12,2500);}catch(e){}},700);
}
const ACT={
  packOk(){const p=document.getElementById('pack');if(p)p.remove();rerender('hub');},
  home(){go('home');},
  gam(d){tmp.gam=tmp.gam||{};tmp.gam[d.k]=d.g;if(view==='hub'){$('#tabc').innerHTML=TABS[tab]();}else rerender(view);},
  lvup(d){const st=S.cardLv[d.id],L=st.lv,need=LVNEED[L];if(L>=LVMAX||st.cp<need)return;st.cp-=need;st.lv++;persist();toast(`${CARDM[d.id].name} puja al nivell ${st.lv}!`);$('#tabc').innerHTML=TABS[tab]();},
  style(){setStyle(STYLE==='real'?'dibuix':'real');rerender(view);},
  music(){setMusic(!musicOn());rerender(view);},
  create(){tmp={};go('create');},
  hub(){if(!S){go('home');return;}go('hub');},
  pickColor(d){tmp.color=+d.i;makePinya(scene.F,scene.c);go('create');},
  setReal(d){tmp.real=d.v==='1';makePinya(scene.F,scene.c);rerender('create');},
  setAs(d){tmp.as=+d.v;makePinya(scene.F,scene.c);rerender('create');},
  setLvl(d){tmp.lvl=d.v==='1';rerender('create');},
  setNom(d){setNom(d.v);rerender(view);},
  found(){const asR=tmp.real&&tmp.as>=0;const nm=asR?REAL[tmp.as].name:(($('#cName')||{}).value||'').trim()||'Castellers de la Plaça';newSave(nm,tmp.color||0,tmp.real,asR?tmp.as:-1,tmp.lvl);tab='castells';setScene(CM['3d6']);toast('Benvinguts a '+nm+'!');go('hub');},
  tab(d){tab=d.t;$('#tabc').innerHTML=TABS[tab]();document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));},
  sound(){S.sound=S.sound===false;persist();rerender('hub');},
  assaig(){if(tmp.gam)delete tmp.gam.assaig;go('assaig');},
  asg(d){const w=S.wk,used=Object.values(w.assign).reduce((a,b)=>a+b,0);const n=w.assign[d.code]||0,dd=+d.d;
    if(dd>0&&used>=w.slots)return;w.assign[d.code]=Math.max(0,n+dd);persist();rerender('assaig');},
  prova(d){S.wk.prova=true;persist();ensureAudio();startAttempt(d.code,'assaig',(res,c)=>{const o=applyResult(res,c,'assaig');setScene(bestCastell());go('result',Object.assign({res,c,assaig:true},o));});},
  closeWeek(){closeWeek();},
  repteOk(){S.repte=S.wk.offer;S.wk.offer=null;persist();toast('Repte acceptat!');rerender('assaig');},
  repteNo(){S.wk.offer=null;persist();rerender('assaig');},
  vacances(){CAST.forEach(c=>{if(S.prep[c.code])S.prep[c.code]=Math.max(0,S.prep[c.code]-9);});S.injured=[];S.moral=clamp(S.moral+3,10,100);
    advanceWeek();persist();toast('Bones vacances! La colla torna amb forces.');go('hub');},
  diada(){if(S.diada)go('diada');else{tmp.cards=[];go('diadaCards');}},
  tcard(d){tmp.cards=tmp.cards||[];const i=tmp.cards.indexOf(d.id);if(i>=0)tmp.cards.splice(i,1);else if(tmp.cards.length<3)tmp.cards.push(d.id);else toast('Només pots portar 3 cartes.');rerender('diadaCards');},
  startDiada(){startDiada();playMus('entrada',true);go('diada');},
  simDiada(){simulateDiada();},
  pick(){if(tmp.gam)delete tmp.gam.pick;go('pick');},
  pickD(d){ensureAudio();startAttempt(d.code,'diada',(res,c)=>{
    const o=applyResult(res,c,'diada');const dd=S.diada;
    if(res==='I'&&(dd.secondLeft||0)>0){dd.secondLeft--;dd.secondFree=true;o.unl.unshift('Segona oportunitat: pots repetir la ronda.');}
    else{dd.rounds.push({code:c.code,res,pts:o.pts});dd.secondFree=false;}
    persist();setScene(bestCastell());go('result',Object.assign({res,c},o));});},
  endDiada(){endDiada(false);},
  buy(d){const it=SHOP.find(x=>x.id===d.id);if(!it||S.bonus<it.cost)return;S.bonus-=it.cost;let msg=it.name+' fet.';
    switch(it.id){
      case 'assaig':S.buffs.assaig+=1;msg='Tindràs un assaig extra la setmana vinent.';break;
      case 'bus':S.buffs.bus=1;msg='L’autocar portarà més gent a la propera diada.';break;
      case 'cervesa':S.moral=clamp(S.moral+10,10,100);S.members+=3;msg='Cervesa gratis! +10 de moral i 3 castellers nous.';break;
      case 'fisio':S.injured=[];msg='Tots els lesionats estan recuperats.';break;
      case 'sopar':S.moral=clamp(S.moral+15,10,100);S.members+=5;msg='Sopar de germanor: +15 de moral i 5 castellers nous.';break;
      case 'camises':S.members+=8;S.moral=clamp(S.moral+5,10,100);msg='Camises noves: 8 castellers nous.';break;
      case 'costellada':S.moral=clamp(S.moral+20,10,100);msg='Costellada de colla: +20 de moral.';break;
      case 'xarxes':S.members+=12;msg='La campanya funciona: 12 castellers nous.';break;
      case 'escola':CAST.forEach(c=>{if(prereqOk(c))S.prep[c.code]=Math.min(100,prepOf(c)+10);});msg='Escola de canalla: +10 de preparació a tots els castells.';break;
      case 'sobre':{const m=S.cards.filter(id=>lvOf(id)<LVMAX);if(!m.length){S.bonus+=it.cost;msg='Totes les teves cartes ja són al nivell màxim.';break;}
        const got=[];for(let i=0;i<4;i++){const id=pick(m);S.cardLv[id].cp++;got.push({id,cp:S.cardLv[id].cp,lv:lvOf(id)});}
        persist();openPack(got);return;}
    }
    persist();toast(msg);rerender('hub');},
  seasonEnd(){go('seasonEnd');},
  newSeason(){newSeason();},
};
document.addEventListener('click',e=>{if(!musStarted&&!att)playBg();const a=e.target.closest('[data-act]');if(!a||a.disabled)return;ensureAudio();const f=ACT[a.dataset.act];if(f)f(a.dataset);});

window.addEventListener('resize',resize);
scene.F=buildFloors(scene.c);
resize();go(S?'hub':'home');requestAnimationFrame(loop);


if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
